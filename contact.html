<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>

    <h1>Contact Us</h1>

    <p>Please fill in the form below to get in touch with us.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <!-- Full Name -->
            <label for="fullname">Full Name:</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >
            <br><br>

            <!-- Email -->
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="magdalenewanyeki78@gmail.com"
                required
            >
            <br><br>

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Message Details</legend>

            <!-- Subject -->
            <label for="subject">Subject:</label>
            <select id="subject" name="subject" required>
                <option value="">Select a subject</option>
                <option value="general">General Inquiry</option>
                <option value="support">Technical Support</option>
                <option value="feedback">Feedback</option>
            </select>
            <br><br>

            <!-- Message -->
            <label for="message">Your Message:</label>
            <br>
            <textarea
                id="message"
                name="message"
                rows="6"
                cols="40"
                placeholder="Write your message here (at least 50 characters)"
                minlength="50"
                required
            ></textarea>
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Newsletter Subscription</legend>

            <input
                type="checkbox"
                id="newsletter"
                name="newsletter"
                value="yes"
            >
            <label for="newsletter">
                I would like to receive newsletter updates.
            </label>

        </fieldset>

        <br>

        <!-- Submit Button -->
        <button type="submit">Submit Form</button>

    </form>

</body>
</html>
